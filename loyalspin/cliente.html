<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LoyalSpin — Mis Puntos</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--surface:#111118;--surface2:#1a1a26;--border:#2a2a3a;--accent:#c8a96e;--accent2:#e8c98e;--text:#f0ede8;--muted:#7a7890}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden;position:relative}
.orb{position:fixed;border-radius:50%;pointer-events:none;z-index:0}
.orb1{width:500px;height:500px;top:-120px;left:-120px;background:radial-gradient(circle,rgba(200,169,110,.07) 0%,transparent 70%);animation:d 12s ease-in-out infinite}
.orb2{width:380px;height:380px;bottom:-80px;right:-80px;background:radial-gradient(circle,rgba(80,60,160,.06) 0%,transparent 70%);animation:d 9s ease-in-out infinite reverse}
@keyframes d{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,20px)}}
.card{position:relative;z-index:1;width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:28px;padding:44px 36px;text-align:center;box-shadow:0 40px 80px rgba(0,0,0,.5);animation:up .6s ease}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.brand{font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:28px}
.brand span{color:var(--accent)}
.avatar{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#7a4e2d);display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:28px;font-weight:800;color:#fff;margin:0 auto 16px;box-shadow:0 8px 28px rgba(200,169,110,.3)}
.name{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;letter-spacing:-.4px;margin-bottom:4px}
.cid{font-size:13px;color:var(--muted);margin-bottom:32px}
.pts-box{background:var(--surface2);border:1px solid var(--border);border-radius:18px;padding:28px 20px;margin-bottom:20px;position:relative;overflow:hidden}
.pts-box::before{content:'';position:absolute;top:0;left:0;right:0;height:1.5px;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:sh 3s ease-in-out infinite}
@keyframes sh{0%,100%{opacity:.3}50%{opacity:.9}}
.pts-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:10px}
.pts-num{font-family:'Syne',sans-serif;font-size:66px;font-weight:800;color:var(--accent);line-height:1;letter-spacing:-2px}
.pts-word{font-size:16px;color:var(--muted);margin-top:6px}
.stars{display:flex;justify-content:center;gap:5px;margin:12px 0 0}
.star{font-size:18px}
.tier{display:inline-block;padding:5px 14px;border-radius:20px;font-size:12px;font-weight:500;margin-top:12px}
.t-bronze{background:rgba(176,100,50,.15);color:#cd7f32;border:1px solid rgba(176,100,50,.25)}
.t-silver{background:rgba(160,160,160,.12);color:#c0c0c0;border:1px solid rgba(160,160,160,.25)}
.t-gold{background:rgba(255,215,0,.12);color:#ffd700;border:1px solid rgba(255,215,0,.25)}
.t-platinum{background:rgba(130,200,220,.12);color:#88d8e8;border:1px solid rgba(130,200,220,.25)}
.prog-row{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin:14px 0 6px}
.prog-bar{height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:width 1.2s ease}
.footer{font-size:11px;color:#3a3850;text-align:center;margin-top:16px;padding-top:16px;border-top:1px solid var(--border);line-height:1.6}
.loader{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.err-icon{font-size:48px;margin-bottom:14px}
.err-title{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;margin-bottom:8px}
.err-msg{color:var(--muted);font-size:14px;line-height:1.7}
</style>
</head>
<body>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="card" id="card">
  <div class="loader"></div>
  <p style="color:var(--muted);font-size:14px">Cargando…</p>
</div>
<script>
const DB={
  getClients:()=>JSON.parse(localStorage.getItem('ls_clients')||'[]')
};
function initials(n){return n.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();}
function getTier(p){
  if(p>=2000)return{name:'Platino',cls:'t-platinum',e:'💎'};
  if(p>=1000)return{name:'Oro',cls:'t-gold',e:'🥇'};
  if(p>=500)return{name:'Plata',cls:'t-silver',e:'🥈'};
  return{name:'Bronce',cls:'t-bronze',e:'🥉'};
}
function getNext(p){
  if(p<500)return{next:500,label:'Plata'};
  if(p<1000)return{next:1000,label:'Oro'};
  if(p<2000)return{next:2000,label:'Platino'};
  return null;
}
function stars(p){
  const n=p>=2000?5:p>=1000?4:p>=500?3:p>=200?2:1;
  return Array.from({length:5},(_,i)=>`<span class="star">${i<n?'⭐':'☆'}</span>`).join('');
}
function load(){
  const id=new URLSearchParams(window.location.search).get('id');
  const card=document.getElementById('card');
  if(!id){card.innerHTML='<div class="err-icon">❓</div><div class="err-title">Sin ID</div><div class="err-msg">Escanea el QR correcto.</div>';return;}
  const c=DB.getClients().find(x=>x.id===id.toUpperCase());
  if(!c){card.innerHTML=`<div class="err-icon">❓</div><div class="err-title">No encontrado</div><div class="err-msg">ID "${id}" no existe. Consulta con el negocio.</div>`;return;}
  const p=c.points||0,tier=getTier(p),next=getNext(p),prog=next?Math.min((p/next.next)*100,100):100;
  card.innerHTML=`
    <div class="brand">Loyal<span>Spin</span> · mis puntos</div>
    <div class="avatar">${initials(c.name)}</div>
    <div class="name">${c.name}</div>
    <div class="cid">ID: ${c.id}${c.phone?' · '+c.phone:''}</div>
    <div class="pts-box">
      <div class="pts-lbl">Puntos acumulados</div>
      <div class="pts-num" id="cnt">0</div>
      <div class="pts-word">puntos</div>
      <div class="stars">${stars(p)}</div>
      <span class="tier ${tier.cls}">${tier.e} Nivel ${tier.name}</span>
      ${next?`<div class="prog-row"><span>${p.toLocaleString()} pts</span><span>${next.next.toLocaleString()} → ${next.label}</span></div><div class="prog-bar"><div class="prog-fill" id="pf"></div></div>`:'<div style="margin-top:10px;font-size:12px;color:var(--accent)">🏆 Nivel máximo</div>'}
    </div>
    <div class="footer">Vista de solo lectura · Consulta con el negocio para más información</div>
  `;
  // Animate
  const dur=1200,start=performance.now();
  (function tick(now){
    const t=Math.min((now-start)/dur,1),e=1-Math.pow(1-t,3);
    document.getElementById('cnt').textContent=Math.floor(e*p).toLocaleString();
    if(t<1)requestAnimationFrame(tick);
    else document.getElementById('cnt').textContent=p.toLocaleString();
  })(performance.now());
  setTimeout(()=>{const pf=document.getElementById('pf');if(pf)pf.style.width=prog+'%';},300);
}
load();
</script>
</body>
</html>
